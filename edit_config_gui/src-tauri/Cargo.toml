[package]
name = "edit_config_gui"
version = "0.1.0"
description = "CapsWriter 配置编辑器"
edition = "2021"
# 1.95 是实测依赖的 MSRV 下限：sysinfo 0.39.6 要 1.95，tauri/tauri-build/
# tauri-plugin-dialog 要 1.90、similar 要 1.85（三者均为 edition 2024）。
# 写低了会在旧工具链上直接爆 edition2024 错误。
rust-version = "1.95"

[lib]
name = "edit_config_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
similar = "3"
sha2 = "0.10"
sysinfo = "0.39"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
] }
