[project]
name = "CapsWriter-Offline"
authors = [{ name = "HaujetZhao" }]
maintainers = [{ name = "H1DDENADM1N" }, { name = "JoanthanWu" }]
version = "7.0.1"
description = "离线语音输入简/繁体、中译英、字幕转录；在线多译多、云剪贴板等等 （选用SenseVoice模型 支持中粤英日韩多语种）"
readme = "readme.md"
requires-python = "==3.14.8"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.5.4,<3",
    "pyside6>=6.12.0",
    "rich>=15.0.0",
    "tomlkit>=0.15.1",
]

[dependency-groups]
server = [
    "flask>=3.1.3",
    "gguf>=0.19.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "numba>=0.68.0",
    "onnxruntime-directml>=1.24.4",
    "pydub>=0.25.1",
    "pypinyin>=0.55.0",
    "sacremoses>=0.2.0",
    "sentencepiece>=0.2.2",
    "sherpa-onnx>=1.12.23",
    "sherpa-onnx-core>=1.12.23",
    "srt>=3.5.3",
    "torch>=2.14.1",
    "transformers>=5.19.0,<6.0.0",
    "watchdog>=6.0.0",
    "websockets>=17.2",
]
client = [
    "clipman>=3.3.3",
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "keyboard>=0.13.5",
    "libretranslatepy>=2.1.4",
    "opencc-python-reimplemented>=0.1.7",
    "openai>=3.29.0",
    "psutil>=7.2.2",
    "pycaw>=20260927",
    "pypinyin>=0.55.0",
    "pywin32>=312",
    "qrcode>=8.2",
    "sniffio>=1.3.1",
    "sounddevice>=0.5.6",
    "srt>=3.5.3",
    "typer>=0.27.3",
    "watchdog>=6.0.0",
    "websockets>=17.2",
    "zai-sdk>=0.2.3",
]
editconfiggui = [
    "keyboard>=0.13.5",
    # siui  PySide6-SiliconUI  https://github.com/H1DDENADM1N/PySide6-SiliconUI
    # Note: siui is not available on PyPI, need to download and copy to .venv/Lib/site-packages and ./site-packages manually
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[project.optional-dependencies]
dev = ["ipynb==0.5.1", "ipykernel>=7.4.0", "pip>=26.2.1", "soundfile>=0.14.0"]

[project.urls]
Repository = "https://github.com/H1DDENADM1N/CapsWriter-Offline"
Issues = "https://github.com/H1DDENADM1N/CapsWriter-Offline/issues"
